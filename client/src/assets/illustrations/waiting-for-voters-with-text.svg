<svg xmlns="http://www.w3.org/2000/svg" width="240" height="204" viewBox="0 0 240 204" fill="none" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- four empty vote-card slots -->
  <rect x="18" y="52" width="42" height="58" rx="8" stroke="#DAD6F0" stroke-width="2" stroke-dasharray="5 5"/>
  <rect x="72" y="46" width="42" height="58" rx="8" stroke="#DAD6F0" stroke-width="2" stroke-dasharray="5 5"/>
  <rect x="126" y="46" width="42" height="58" rx="8" stroke="#DAD6F0" stroke-width="2" stroke-dasharray="5 5"/>
  <rect x="180" y="52" width="42" height="58" rx="8" stroke="#DAD6F0" stroke-width="2" stroke-dasharray="5 5"/>

  <!-- a small "?" mark centered in each slot to read as unrevealed votes -->
  <text x="39" y="87" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="700" fill="#DAD6F0">?</text>
  <text x="93" y="81" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="700" fill="#DAD6F0">?</text>
  <text x="147" y="81" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="700" fill="#DAD6F0">?</text>
  <text x="201" y="87" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="700" fill="#DAD6F0">?</text>

  <!-- waiting badge, overlapping the third slot -->
  <circle cx="168" cy="40" r="18" fill="#F2A93B"/>
  <path d="M168 32v8l6 4" stroke="#1B1D29" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="168" cy="40" r="18" fill="none" stroke="#fff" stroke-width="2.5"/>

  <!-- caption -->
  <text x="120" y="150" text-anchor="middle" font-family="'IBM Plex Sans', sans-serif" font-size="17" font-weight="500" fill="#1B1D29">Waiting for voters to join</text>
</svg>
